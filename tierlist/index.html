<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="PVPBattles TierList - Minecraft PvP Player Rankings"
    >

    <title>PVPBattles | TierList</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">
    <nav class="main-nav">

        <div class="nav-side nav-left">
            <a class="nav-link" href="../home/">Home</a>
            <a class="nav-link active" href="./">TierList</a>
            <a
                class="nav-link"
                href="https://discord.gg/mBeztWy2Z3"
                target="_blank"
                rel="noopener"
            >
                Discord
            </a>
        </div>

        <a class="nav-logo" href="../home/">
            <img src="../assets/header.png" alt="PVPBattles">
        </a>

        <div class="nav-side nav-right">
            <a class="nav-link" href="../client/">Client</a>
            <a class="nav-link" href="../server/">Server</a>
            <a class="nav-link" href="../link/">Link</a>
        </div>

    </nav>
</header>


<main>

    <section class="tier-hero">

        <div class="hero-inner">

            <span class="section-kicker">PVPBATTLES</span>

            <h1>TierList</h1>

            <p>
                Minecraft PvPプレイヤーの競技力をランキング形式で掲載。
            </p>

        </div>

    </section>


    <section class="tier-section">

        <div class="tier-container">

            <!-- Kit Navigation -->
            <div class="kit-tabs">

                <button class="kit-tab active" data-kit="overall">
                    <img
                        src="../assets/tierlist/overall.png"
                        alt=""
                    >
                    <span>Overall</span>
                </button>

                <button class="kit-tab" data-kit="sword">
                    <img
                        src="../assets/tierlist/sword.png"
                        alt=""
                    >
                    <span>Sword</span>
                </button>

                <button class="kit-tab" data-kit="axe">
                    <img
                        src="../assets/tierlist/axe.png"
                        alt=""
                    >
                    <span>Axe</span>
                </button>

                <button class="kit-tab" data-kit="pot">
                    <img
                        src="../assets/tierlist/pot.png"
                        alt=""
                    >
                    <span>Pot</span>
                </button>

                <button class="kit-tab" data-kit="nethop">
                    <img
                        src="../assets/tierlist/nethop.png"
                        alt=""
                    >
                    <span>NethOP</span>
                </button>

                <button class="kit-tab" data-kit="smp">
                    <img
                        src="../assets/tierlist/smp.png"
                        alt=""
                    >
                    <span>SMP</span>
                </button>

                <button class="kit-tab" data-kit="uhc">
                    <img
                        src="../assets/tierlist/uhc.png"
                        alt=""
                    >
                    <span>UHC</span>
                </button>

                <button class="kit-tab" data-kit="mace">
                    <img
                        src="../assets/tierlist/mace.png"
                        alt=""
                    >
                    <span>Mace</span>
                </button>

                <button class="kit-tab" data-kit="endgame">
                    <img
                        src="../assets/tierlist/endgame.png"
                        alt=""
                    >
                    <span>EndGame</span>
                </button>

            </div>


            <!-- Search -->
            <div class="search-box">

                <span class="search-icon">⌕</span>

                <input
                    id="player-search"
                    type="search"
                    placeholder="Search players..."
                    autocomplete="off"
                >

            </div>


            <!-- Ranking -->
            <div class="ranking-card">

                <div class="ranking-header">

                    <span class="rank-column">#</span>

                    <span class="player-column">
                        Player
                    </span>

                    <span class="tier-column">
                        Tier
                    </span>

                    <span class="points-column">
                        Points
                    </span>

                </div>

                <div id="player-list"></div>

            </div>


            <!-- Empty -->
            <div
                id="empty-state"
                class="empty-state hidden"
            >
                <strong>No players found</strong>
                <span>該当するプレイヤーが見つかりません。</span>
            </div>

        </div>

    </section>


    <!-- Player Modal -->
    <div
        id="player-modal"
        class="modal hidden"
        aria-hidden="true"
    >

        <div class="modal-backdrop"></div>

        <div
            class="player-modal"
            role="dialog"
            aria-modal="true"
        >

            <button
                id="modal-close"
                class="modal-close"
                type="button"
                aria-label="Close"
            >
                ×
            </button>


            <div class="player-profile">

                <img
                    id="modal-skin"
                    class="modal-skin"
                    src=""
                    alt=""
                >

                <div class="profile-info">

                    <span class="profile-label">
                        PLAYER
                    </span>

                    <h2 id="modal-name">
                        Player
                    </h2>

                    <div class="profile-overall">

                        <span id="modal-overall-tier">
                            LT5
                        </span>

                        <span id="modal-overall-points">
                            0 Points
                        </span>

                    </div>

                </div>

            </div>


            <div class="modal-divider"></div>


            <div class="kit-results" id="modal-kits"></div>


        </div>

    </div>

</main>


<footer>

    <div class="footer-inner">

        <span class="footer-brand">
            PVPBattles
        </span>

        <span class="footer-copy">
            © 2026 PVPBattles. All rights reserved.
        </span>

    </div>

</footer>


<script src="script.js"></script>

</body>
</html>
